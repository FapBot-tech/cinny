<script>
    // Ping Plausible every 1 minute (60000 milliseconds)
    // This keeps the user in "Current Visitors" and perfectly tracks visit duration.
    setInterval(() => {
        if (window.plausible) {
            window.plausible('Heartbeat'); // Sends a custom event
        }
    }, 60000);

    // Track time milestones
    (() => {
        let startTime = Date.now();
        let milestones = [10, 15, 20, 30, 45, 60, 90, 120, 180, 240, 300];
        let tracked = {};

        setInterval(() => {
            if (location.pathname === '/' && (location.hash === '' || location.hash === '#/')) return;

            let elapsedMinutes = Math.floor((Date.now() - startTime) / 60000);
            milestones.forEach((m) => {
                if (elapsedMinutes >= m && !tracked[m]) {
                    if (window.plausible) {
                        window.plausible('TimeSpent', { props: { minutes: m } });
                        tracked[m] = true;
                    }
                }
            });
        }, 10000); // Check every 10 seconds
    })();
